[project]
name = "deepagents-harness"
version = "0.1.0"
description = "DeepAgents minimal agent demo with Zhipu GLM-5.1"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.8",
    "fastapi>=0.136.3",
    "langchain-openai>=1.2.2",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.5.0",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
