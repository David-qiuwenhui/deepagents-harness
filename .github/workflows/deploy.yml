name: Deploy to HF Spaces

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "ERROR: HF_TOKEN is not set"
            exit 1
          fi
          if [ -z "${{ secrets.HF_SPACE_ID }}" ]; then
            echo "ERROR: HF_SPACE_ID is not set"
            exit 1
          fi
          echo "HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}"

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          git remote add hf https://ci-user:${HF_TOKEN}@huggingface.co/spaces/${{ secrets.HF_SPACE_ID }}
          git push hf master:main --force
